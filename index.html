<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Open in Obsidian</title>
<style>
  :root { --bg: #f6f4ef; --ink: #1f1f21; --muted: #6b6a66; --button: #1f1f21; --button-ink: #f6f4ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1f21; --ink: #f6f4ef; --muted: #a3a19b; --button: #f6f4ef; --button-ink: #1f1f21; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { padding: 24px; text-align: center; max-width: 420px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.button { display: inline-block; padding: 14px 28px; border-radius: 12px; background: var(--button);
             color: var(--button-ink); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p id="status">Opening in Obsidian</p>
  <a class="button" id="open" href="#">Open in Obsidian</a>
</main>
<script>
  // Hands a note link on to Obsidian. The note and vault names travel after
  // the "#", which browsers never send to the server, so the host only ever
  // sees that this page was loaded. Format: #v=<vault>&f=<note path>
  const params = new URLSearchParams(location.hash.slice(1));
  const vault = params.get("v");
  const file = params.get("f");
  const button = document.getElementById("open");
  if (vault && file) {
    const target = "obsidian://open?vault=" + encodeURIComponent(vault) + "&file=" + encodeURIComponent(file);
    button.href = target;
    location.replace(target);
  } else {
    document.getElementById("status").textContent = "This link has no note in it.";
    button.remove();
  }
</script>
</body>
</html>
